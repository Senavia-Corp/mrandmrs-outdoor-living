<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 644" role="img" aria-labelledby="t d">
<title id="t">Four things turn a patio into an outdoor room</title>
<desc id="d">Two versions of the same patio, side by side. In the large one a pergola overhead, a paved floor stepped up out of the grass, a hedge closing the right side and a sconce at sitting height hold a chair, a table and a sofa inside a pocket of warm light. In the small pale one the same three pieces stand alone on open lawn.</desc>
<defs>
<radialGradient id="luz" gradientUnits="userSpaceOnUse" cx="72" cy="200" r="330">
<stop offset="0" stop-color="#f4b248" stop-opacity=".36"/><stop offset="1" stop-color="#f4b248" stop-opacity=".08"/>
</radialGradient>
<style>
.f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:23px;font-weight:650;fill:#000f36}
.p{font-size:17px;fill:#1a3373}
.s{font-size:15px;fill:#596b9a}
.n{font-size:13px;fill:#596b9a}
.b{font-size:13px;font-weight:650;fill:#ffffff}
</style>
</defs>
<rect width="700" height="644" fill="#ffffff"/>

<text class="f h" x="36" y="40">What makes it read as a room</text>
<text class="f s" x="36" y="66">The same sofa, table and chair — with the four, and without them</text>

<g transform="translate(36,78)">

  <!-- cesped y solado -->
  <rect x="0" y="308" width="410" height="26" fill="#f3f5f9"/>
  <rect x="30" y="288" width="350" height="20" fill="#eef1f7"/>

  <!-- el volumen que queda dentro -->
  <rect x="52" y="100" width="300" height="188" fill="url(#luz)"/>

  <!-- espalda: cierra un lado -->
  <path d="M248 288 L248 180 Q248 162 265 162 Q283 162 283 180 Q283 162 300 162 Q318 162 318 180 Q318 162 335 162 Q352 162 352 180 L352 288 Z" fill="#eef1f7" stroke="#000f36" stroke-width="3" stroke-linejoin="round"/>

  <!-- los mismos muebles -->
  <g fill="#f6f7fa" stroke="#8794b6" stroke-width="2">
    <rect x="232" y="224" width="110" height="30"/>
    <rect x="226" y="254" width="122" height="18"/>
    <rect x="150" y="262" width="58" height="8"/>
    <rect x="80" y="224" width="44" height="30"/>
    <rect x="76" y="254" width="52" height="18"/>
  </g>
  <g stroke="#8794b6" stroke-width="2">
    <line x1="234" y1="272" x2="234" y2="288"/><line x1="340" y1="272" x2="340" y2="288"/>
    <line x1="156" y1="270" x2="156" y2="288"/><line x1="202" y1="270" x2="202" y2="288"/>
    <line x1="82" y1="272" x2="82" y2="288"/><line x1="122" y1="272" x2="122" y2="288"/>
  </g>

  <!-- plano de techo -->
  <rect x="40" y="100" width="12" height="188" fill="#eef1f7" stroke="#000f36" stroke-width="3"/>
  <rect x="352" y="100" width="12" height="188" fill="#eef1f7" stroke="#000f36" stroke-width="3"/>
  <rect x="28" y="88" width="348" height="12" fill="#eef1f7" stroke="#000f36" stroke-width="3"/>
  <g stroke="#000f36" stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="74" x2="40" y2="88"/><line x1="67" y1="74" x2="67" y2="88"/>
    <line x1="94" y1="74" x2="94" y2="88"/><line x1="121" y1="74" x2="121" y2="88"/>
    <line x1="148" y1="74" x2="148" y2="88"/><line x1="175" y1="74" x2="175" y2="88"/>
    <line x1="202" y1="74" x2="202" y2="88"/><line x1="229" y1="74" x2="229" y2="88"/>
    <line x1="256" y1="74" x2="256" y2="88"/><line x1="283" y1="74" x2="283" y2="88"/>
    <line x1="310" y1="74" x2="310" y2="88"/><line x1="337" y1="74" x2="337" y2="88"/>
    <line x1="364" y1="74" x2="364" y2="88"/>
  </g>

  <!-- el suelo cambia en el borde -->
  <path d="M0 308 L30 308 L30 288 L380 288 L380 308 L410 308" fill="none" stroke="#000f36" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#8794b6" stroke-width="2" stroke-linecap="round">
    <line x1="8" y1="308" x2="8" y2="296"/><line x1="17" y1="308" x2="17" y2="301"/>
    <line x1="384" y1="308" x2="384" y2="301"/><line x1="393" y1="308" x2="393" y2="296"/>
    <line x1="402" y1="308" x2="402" y2="301"/>
  </g>

  <!-- luz propia, a la altura de la gente -->
  <line x1="52" y1="184" x2="78" y2="184" stroke="#000f36" stroke-width="3"/>
  <path d="M66 184 L90 184 L98 204 L58 204 Z" fill="#f6f7fa" stroke="#000f36" stroke-width="3" stroke-linejoin="round"/>

  <!-- numeros -->
  <g stroke="#1a3373" stroke-width="2">
    <line x1="204" y1="67" x2="204" y2="74"/>
    <line x1="25" y1="186" x2="50" y2="185"/>
  </g>
  <g fill="#000f36">
    <circle cx="204" cy="56" r="11"/><circle cx="56" cy="320" r="11"/>
    <circle cx="300" cy="198" r="11"/><circle cx="14" cy="186" r="11"/>
  </g>
  <g class="f b" text-anchor="middle">
    <text x="204" y="61">1</text><text x="56" y="325">2</text>
    <text x="300" y="203">3</text><text x="14" y="191">4</text>
  </g>

  <line x1="428" y1="56" x2="428" y2="334" stroke="#e0e4ec" stroke-width="2"/>

  <!-- al lado: los mismos muebles, sin ninguna de las cuatro -->
  <text class="f s" x="450" y="240">Same furniture.</text>
  <text class="f s" x="450" y="260">None of the four.</text>
  <line x1="450" y1="308" x2="628" y2="308" stroke="#c7cddd" stroke-width="2"/>
  <g fill="#fbfcfd" stroke="#c7cddd" stroke-width="2">
    <rect x="468" y="270" width="72" height="18"/>
    <rect x="465" y="288" width="78" height="11"/>
    <rect x="554" y="292" width="36" height="6"/>
    <rect x="598" y="270" width="26" height="18"/>
    <rect x="596" y="288" width="30" height="11"/>
  </g>
  <g stroke="#c7cddd" stroke-width="2">
    <line x1="469" y1="299" x2="469" y2="308"/><line x1="539" y1="299" x2="539" y2="308"/>
    <line x1="557" y1="298" x2="557" y2="308"/><line x1="586" y1="298" x2="586" y2="308"/>
    <line x1="600" y1="299" x2="600" y2="308"/><line x1="622" y1="299" x2="622" y2="308"/>
    <line x1="454" y1="308" x2="454" y2="299"/><line x1="461" y1="308" x2="461" y2="303"/>
    <line x1="617" y1="308" x2="617" y2="303"/><line x1="624" y1="308" x2="624" y2="299"/>
  </g>
</g>

<g fill="#000f36">
  <circle cx="47" cy="451" r="11"/><circle cx="47" cy="481" r="11"/>
  <circle cx="47" cy="511" r="11"/><circle cx="47" cy="541" r="11"/>
</g>
<g class="f b" text-anchor="middle">
  <text x="47" y="456">1</text><text x="47" y="486">2</text>
  <text x="47" y="516">3</text><text x="47" y="546">4</text>
</g>
<g class="f s">
  <text x="70" y="456">A plane overhead — a pergola, slats, or the eave you already have.</text>
  <text x="70" y="486">A floor that changes at the edge — new material, or a step up.</text>
  <text x="70" y="516">A back closing one side — a wall, a hedge, a tall cabinet.</text>
  <text x="70" y="546">Its own light at sitting height, not from overhead.</text>
</g>

<text class="f p" x="36" y="594">Not one of the four is a piece of furniture.</text>
<text class="f s" x="36" y="618">Better chairs on open grass are still chairs on open grass.</text>
</svg>
